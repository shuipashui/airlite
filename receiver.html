<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05060a" />
  <title>光渡 · 手机接收端</title>
  <style>
    :root {
      --bg: #05060a;
      --text: #eef0f5;
      --mute: #8b90a1;
      --accent: #3dffb0;
      --danger: #ff5d6c;
      --panel: rgba(12,14,20,.82);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; cursor: pointer; }
    .view { position: relative; height: 100%; overflow: hidden; background: #000; }
    #video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #111; z-index: 0;
    }
    canvas.overlay {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; background: transparent; z-index: 1;
    }
    .top, .bot {
      position: absolute; left: 0; right: 0; z-index: 3;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    }
    .bot { top: auto; bottom: 0; padding: 10px 14px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.78)); }
    .top { background: linear-gradient(rgba(0,0,0,.65), transparent); }
    .brand { display: flex; justify-content: space-between; align-items: baseline; }
    .brand h1 { margin: 0; font-size: 16px; }
    .brand span { color: var(--mute); font-size: 12px; }
    .card {
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid #2a3040; border-radius: 14px; padding: 12px;
    }
    .name { font-weight: 650; margin-bottom: 6px; word-break: break-all; }
    .bar { height: 8px; background: #1b2030; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
    .stat { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #c5c9d6; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .btn {
      flex: 1; border: 0; border-radius: 10px; padding: 12px;
      background: var(--accent); color: #04140d; font-weight: 700;
    }
    .btn.ghost { background: #1c2230; color: var(--text); font-weight: 600; }
    .gate {
      position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
      background: var(--bg); padding: 24px; overflow: auto;
    }
    .gate .box { max-width: 440px; width: 100%; }
    .gate h2 { margin: 0 0 8px; font-size: 22px; }
    .gate p { color: var(--mute); line-height: 1.65; }
    .warn { color: #ffb020; font-size: 14px; }
    .ok { color: var(--accent); }
    .err { color: var(--danger); }
    .done { display: none; }
    .done.show { display: block; }
    a.link { color: var(--accent); word-break: break-all; }
  </style>
</head>
<body>
  <div class="view">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <canvas class="overlay" id="overlay"></canvas>
    <div class="top">
      <div class="brand">
        <h1>光渡 · 接收</h1>
        <span id="camInfo">等待摄像头</span>
      </div>
    </div>
    <div class="bot">
      <div class="card">
        <div class="name" id="fileName">对准电脑屏幕上的二维码</div>
        <div class="bar"><i id="bar"></i></div>
        <div class="stat">
          <span id="prog">0 / ?</span>
          <span id="rate">0 KB/s</span>
        </div>
        <div class="stat">
          <span id="detail">尚未锁定会话</span>
          <span id="fps">—</span>
        </div>
        <div class="done" id="doneBox">
          <div class="row">
            <button class="btn" type="button" id="btnSave">保存文件</button>
            <button class="btn ghost" type="button" id="btnCopy" hidden>复制文字</button>
          </div>
        </div>
        <div class="row">
          <button class="btn ghost" type="button" id="btnFlip">切换镜头</button>
          <button class="btn ghost" type="button" id="btnTorch">手电筒</button>
          <button class="btn ghost" type="button" id="btnReset">重新接收</button>
        </div>
      </div>
    </div>
    <div class="gate" id="gate">
      <div class="box">
        <h2>打开摄像头开始接收</h2>
        <p>用手机浏览器打开本页，对准电脑屏幕上正在播放的二维码。传文件本身不走网络。</p>
        <p class="warn" id="secureWarn" hidden></p>
        <p class="warn" id="appWarn" hidden>检测到微信/QQ 内置浏览器，通常无法开摄像头。请点右上角 <b>…</b>，选「在浏览器中打开」（Safari / Chrome）。</p>
        <div class="row"><button class="btn" type="button" id="btnStart">授权并打开摄像头</button></div>
        <p id="err" class="err"></p>
        <p id="pageLink" hidden>正确地址：<a class="link" id="httpsLink" href="#"></a></p>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="vendor/fflate.js"></script>
  <script src="protocol.js"></script>
  <script>
    (function () {
      var RECEIVER = (window.AIRLITE && AIRLITE.RECEIVER) || (location.protocol + "//" + location.host + location.pathname);
      var $ = function (id) { return document.getElementById(id); };
      var video = $("video");
      var overlay = $("overlay");
      var octx = overlay.getContext("2d");
      var P = window.AirLite;
      var ua = navigator.userAgent || "";
      var inApp = /MicroMessenger|QQ\//i.test(ua) || /miniProgram|DingTalk|BytedanceWebview|Aweme/i.test(ua);
      var secure = window.isSecureContext === true;
      var rx = P ? new P.FountainRx() : null;

      var stream = null;
      var preferBack = true;
      var detector = null;
      var busy = false;
      var lastBytes = 0;
      var lastT = 0;
      var decoded = 0;
      var lastDecodedT = 0;
      var decodeFps = 0;
      var result = null;
      var workCanvas = document.createElement("canvas");
      var wctx = workCanvas.getContext("2d", { willReadFrequently: true });
      var running = false;
      var scanSeq = 0;

      video.setAttribute("playsinline", "true");
      video.setAttribute("webkit-playsinline", "true");
      video.muted = true;
      video.autoplay = true;
      video.playsInline = true;

      $("httpsLink").href = RECEIVER;
      $("httpsLink").textContent = RECEIVER;

      if (!secure) {
        $("secureWarn").hidden = false;
        $("secureWarn").innerHTML = "当前页面不是 HTTPS，手机浏览器会禁止摄像头。<br>请用手机点击打开：";
        $("pageLink").hidden = false;
      }
      if (inApp) $("appWarn").hidden = false;
      if (!P) $("err").textContent = "协议脚本没加载到。请从 GitHub 网页打开接收端，不要只保存单个 HTML。";

      function fmtBytes(n) {
        if (n < 1024) return n + " B";
        if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
        return (n / 1048576).toFixed(2) + " MB";
      }

      function bytesFromDetect(raw) {
        if (!raw || !P) return null;
        if (raw instanceof Uint8Array) return raw;
        if (Array.isArray(raw)) return new Uint8Array(raw);
        if (typeof raw === "string") return P.binStrToBytes(raw);
        return null;
      }

      function ingest(u8) {
        if (!rx) return false;
        var frame = P.parseFrame(u8);
        if (!frame) return false;
        if (frame.type === P.TYPE_DESC) {
          rx.applyDesc(frame);
          return true;
        }
        if (!rx.ready) return false;
        if (frame.session !== rx.session) return false;
        if (frame.type === P.TYPE_SRC) rx.addSource(frame.extra, frame.payload);
        else if (frame.type === P.TYPE_REP) rx.addRepair(frame.extra, frame.payload);
        return true;
      }

      function paintOverlay(boxes) {
        var w = overlay.width = overlay.clientWidth || window.innerWidth || 1;
        var h = overlay.height = overlay.clientHeight || window.innerHeight || 1;
        octx.clearRect(0, 0, w, h);
        var vw = video.videoWidth || w;
        var vh = video.videoHeight || h;
        var scale = Math.min(w / vw, h / vh);
        var ox = (w - vw * scale) / 2;
        var oy = (h - vh * scale) / 2;
        octx.strokeStyle = "#3dffb0";
        octx.lineWidth = 3;
        (boxes || []).forEach(function (b) {
          if (!b || !b.length) return;
          octx.beginPath();
          octx.moveTo(ox + b[0].x * scale, oy + b[0].y * scale);
          for (var i = 1; i < b.length; i++) octx.lineTo(ox + b[i].x * scale, oy + b[i].y * scale);
          octx.closePath();
          octx.stroke();
        });
      }

      function updateHud() {
        if (!rx || !rx.ready) {
          $("fileName").textContent = "正在寻找描述符帧…对准屏幕";
          $("prog").textContent = "0 / ?";
          $("bar").style.width = "0%";
          $("detail").textContent = "解码 " + decoded + " 帧有效";
        } else {
          var pct = rx.numChunks ? (rx.got / rx.numChunks) * 100 : 0;
          $("fileName").textContent = rx.name || "未命名";
          $("prog").textContent = rx.got + " / " + rx.numChunks;
          $("bar").style.width = Math.min(100, pct) + "%";
          $("detail").textContent = "源 " + rx.seenSrc + " · 修复 " + rx.seenRep + " · 描述符 " + rx.seenDesc;
        }
        $("fps").textContent = decodeFps.toFixed(0) + " 解/秒";
        var now = performance.now();
        if (lastT) {
          var dt = (now - lastT) / 1000;
          var db = (rx ? rx.got * (rx.chunkSize || 0) : 0) - lastBytes;
          if (dt > 0.4) {
            $("rate").textContent = fmtBytes(Math.max(0, db) / dt) + "/s";
            lastBytes = rx ? rx.got * (rx.chunkSize || 0) : 0;
            lastT = now;
          }
        } else {
          lastT = now;
          lastBytes = 0;
        }
        if (now - lastDecodedT > 1000) {
          decodeFps = decoded;
          decoded = 0;
          lastDecodedT = now;
        }
      }

      function finishIfDone() {
        if (!rx || !rx.complete() || result) return;
        var assembled = rx.assemble();
        if (!assembled) return;
        if (assembled.error) {
          $("detail").innerHTML = '<span class="err">CRC 校验失败，继续收修复符号…</span>';
          rx.got = Object.keys(rx.symbols).length;
          return;
        }
        var data = assembled.data;
        var name = assembled.name || "file.bin";
        if ((assembled.flags & 1) && typeof fflate !== "undefined") {
          try { data = fflate.gunzipSync(data); }
          catch (e) {
            $("detail").innerHTML = '<span class="err">解压失败</span>';
            return;
          }
        }
        result = { name: name, data: data };
        $("doneBox").classList.add("show");
        $("fileName").innerHTML = '<span class="ok">完成 · ' + name + "</span>";
        $("bar").style.width = "100%";
        $("prog").textContent = fmtBytes(data.length);
        $("btnCopy").hidden = !/\.(txt|md|json|csv|log)$/i.test(name);
        try { navigator.vibrate && navigator.vibrate([40, 40, 80]); } catch (_) {}
      }

      function scanWithJsQR(w, h) {
        if (typeof jsQR !== "function") return [];
        var hw = (w / 2) | 0, hh = (h / 2) | 0;
        var jobs = [
          { x: 0, y: 0, w: w, h: h },
          { x: 0, y: 0, w: hw, h: hh },
          { x: hw, y: 0, w: w - hw, h: hh },
          { x: 0, y: hh, w: hw, h: h - hh },
          { x: hw, y: hh, w: w - hw, h: h - hh }
        ];
        var j = jobs[scanSeq % jobs.length];
        scanSeq++;
        var slice = wctx.getImageData(j.x, j.y, j.w, j.h);
        var code = jsQR(slice.data, j.w, j.h, { inversionAttempts: "dontInvert" });
        if (!code) return [];
        var bytes = bytesFromDetect(code.binaryData) || (P && P.binStrToBytes(code.data || ""));
        if (!ingest(bytes)) return [];
        decoded++;
        if (!code.location) return [];
        return [[
          { x: code.location.topLeftCorner.x + j.x, y: code.location.topLeftCorner.y + j.y },
          { x: code.location.topRightCorner.x + j.x, y: code.location.topRightCorner.y + j.y },
          { x: code.location.bottomRightCorner.x + j.x, y: code.location.bottomRightCorner.y + j.y },
          { x: code.location.bottomLeftCorner.x + j.x, y: code.location.bottomLeftCorner.y + j.y }
        ]];
      }

      async function scanFrame() {
        if (busy || !running || result || !video.videoWidth) return;
        busy = true;
        try {
          var vw = video.videoWidth;
          var vh = video.videoHeight;
          var boxes = [];
          if (detector) {
            try {
              var codes = await detector.detect(video);
              for (var i = 0; i < codes.length; i++) {
                var c = codes[i];
                if (ingest(bytesFromDetect(c.rawValue))) {
                  decoded++;
                  if (c.cornerPoints) boxes.push(c.cornerPoints);
                }
              }
            } catch (_) {}
          }
          if (!rx || !rx.ready || boxes.length < 2) {
            var maxW = 1280;
            var scale = vw > maxW ? maxW / vw : 1;
            var dw = Math.max(1, (vw * scale) | 0);
            var dh = Math.max(1, (vh * scale) | 0);
            if (workCanvas.width !== dw || workCanvas.height !== dh) {
              workCanvas.width = dw;
              workCanvas.height = dh;
            }
            wctx.drawImage(video, 0, 0, dw, dh);
            var more = scanWithJsQR(dw, dh);
            for (var k = 0; k < more.length; k++) boxes.push(more[k]);
          }
          paintOverlay(boxes);
          updateHud();
          finishIfDone();
        } finally {
          busy = false;
        }
      }

      function loop() {
        if (!running) return;
        scanFrame();
        if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(loop);
        else requestAnimationFrame(loop);
      }

      function explainCamError(e) {
        var name = (e && e.name) || "";
        var msg = (e && e.message) || String(e || "未知错误");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return "这个浏览器没有摄像头接口。请用 Safari 或 Chrome 打开：" + RECEIVER;
        }
        if (!secure) return "非 HTTPS 页面无法开摄像头。请打开：" + RECEIVER;
        if (inApp) return "请在系统浏览器中打开本页，不要用微信/QQ 内置窗口。";
        if (name === "NotAllowedError" || name === "PermissionDeniedError") return "你拒绝了摄像头权限。请到系统设置里允许此网站使用相机，再重试。";
        if (name === "NotFoundError" || name === "DevicesNotFoundError") return "没找到摄像头。";
        if (name === "NotReadableError" || name === "TrackStartError") return "摄像头被别的应用占用。";
        if (name === "OverconstrainedError") return "当前相机参数不被支持，请再点一次重试。";
        return "无法打开摄像头：" + name + " " + msg;
      }

      async function openCamera() {
        var md = navigator.mediaDevices;
        if (!md || !md.getUserMedia) throw new Error("no-api");
        var face = preferBack ? "environment" : "user";
        var tries = [
          { audio: false, video: { facingMode: { ideal: face } } },
          { audio: false, video: { facingMode: face } },
          { audio: false, video: true }
        ];
        var last = null;
        for (var i = 0; i < tries.length; i++) {
          try {
            return await md.getUserMedia(tries[i]);
          } catch (e) {
            last = e;
          }
        }
        throw last || new Error("getUserMedia failed");
      }

      async function startCam() {
        $("err").textContent = "";
        if (!P) {
          $("err").textContent = "脚本未加载，请用手机打开 " + RECEIVER;
          return;
        }
        try {
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          stream = await openCamera();
          video.srcObject = stream;
          if (!video.videoWidth) {
            await new Promise(function (resolve) {
              var done = false;
              function finish() {
                if (done) return;
                done = true;
                video.onloadedmetadata = null;
                resolve();
              }
              video.onloadedmetadata = finish;
              setTimeout(finish, 2000);
            });
          }
          try { await video.play(); } catch (_) {}
          $("gate").style.display = "none";
          $("camInfo").textContent = (video.videoWidth || "?") + "×" + (video.videoHeight || "?");
          if ("BarcodeDetector" in window) {
            try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (_) { detector = null; }
          }
          running = true;
          loop();
        } catch (e) {
          $("err").textContent = explainCamError(e);
          $("pageLink").hidden = false;
        }
      }

      function resetRx() {
        if (rx) rx.reset();
        result = null;
        decoded = 0;
        lastBytes = 0;
        lastT = 0;
        $("doneBox").classList.remove("show");
        $("btnCopy").hidden = true;
        $("fileName").textContent = "对准电脑屏幕上的二维码";
        $("bar").style.width = "0%";
        $("prog").textContent = "0 / ?";
        $("detail").textContent = "会话已重置";
      }

      $("btnStart").onclick = startCam;
      $("btnFlip").onclick = function () {
        preferBack = !preferBack;
        startCam();
      };
      $("btnReset").onclick = resetRx;
      $("btnSave").onclick = function () {
        if (!result) return;
        var blob = new Blob([result.data], { type: "application/octet-stream" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = result.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      };
      $("btnCopy").onclick = async function () {
        if (!result) return;
        var text = new TextDecoder().decode(result.data);
        try {
          await navigator.clipboard.writeText(text);
          $("detail").textContent = "已复制到剪贴板";
        } catch (_) {
          $("detail").textContent = "复制失败，请改用保存";
        }
      };
      $("btnTorch").onclick = async function () {
        var track = stream && stream.getVideoTracks()[0];
        if (!track) return;
        var caps = track.getCapabilities && track.getCapabilities();
        if (!caps || !caps.torch) {
          $("detail").textContent = "此摄像头不支持手电筒";
          return;
        }
        var on = !track.getSettings().torch;
        try { await track.applyConstraints({ advanced: [{ torch: on }] }); } catch (_) {}
      };
    })();
  </script>
</body>
</html>
