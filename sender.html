<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>光渡 · 电脑发送端</title>
  <style>
    :root {
      --bg: #07080c;
      --panel: #11131a;
      --line: #232736;
      --text: #e8eaef;
      --mute: #8b90a1;
      --accent: #3dffb0;
      --accent-dim: #1a6b4d;
      --warn: #ffb020;
      --danger: #ff5d6c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100%; display: flex; flex-direction: column; }
    header.top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 22px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(145deg, var(--accent), #2a8cff);
      display: grid; place-items: center; color: #04140d; font-weight: 800;
    }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
    .brand p { margin: 2px 0 0; color: var(--mute); font-size: 12px; }
    .wrap { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
    aside {
      border-right: 1px solid var(--line); padding: 18px; overflow: auto;
      background: #0b0d13;
    }
    .banner {
      display: none; margin: 0 18px 12px; padding: 8px 10px; border-radius: 8px;
      background: #3a1c22; color: #ffc7cd; font-size: 12px; line-height: 1.5;
    }
    .banner.show { display: block; }
    .drop {
      display: block;
      border: 1.5px dashed #2d3346; border-radius: 14px; padding: 18px 14px;
      text-align: center; background: #0e1118; transition: .15s border, .15s background;
    }
    .drop.over { border-color: var(--accent); background: #102018; }
    .drop strong { display: block; margin-bottom: 6px; }
    .drop .sub { color: var(--mute); font-size: 12px; display: block; margin-bottom: 12px; }
    #file {
      display: block; width: 100%; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; padding: 8px;
    }
    .picked {
      margin-top: 10px; text-align: left; font-size: 12px; color: var(--accent);
      word-break: break-all; min-height: 1.4em;
    }
    .row { margin-top: 16px; }
    label.k { display: block; color: var(--mute); font-size: 12px; margin-bottom: 6px; }
    select, textarea, input[type="text"] {
      width: 100%; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
    }
    textarea { min-height: 84px; resize: vertical; }
    .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .preset {
      text-align: left; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    }
    .preset.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .preset b { display: block; font-size: 13px; }
    .preset small { color: var(--mute); }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      flex: 1; border: 0; border-radius: 10px; padding: 11px 12px; font-weight: 650;
    }
    .btn.primary { background: var(--accent); color: #04140d; }
    .btn.ghost { background: #1a1e2a; color: var(--text); }
    .meta { margin-top: 14px; font-size: 12px; color: var(--mute); line-height: 1.65; }
    .meta b { color: var(--text); font-weight: 600; }
    main.stage { position: relative; display: grid; place-items: center; background: #000; overflow: hidden; }
    #qrStage { width: 100%; height: 100%; display: block; }
    .live { margin-top: 12px; font-size: 12px; color: var(--mute); line-height: 1.6; }
    .live .bar { height: 6px; background: #222; border-radius: 99px; overflow: hidden; margin: 6px 0; }
    .live .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
    .empty {
      position: absolute; color: var(--mute); text-align: center; max-width: 460px; padding: 20px;
    }
    .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 8px; }
    .pair { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #pairQr { width: 196px; height: 196px; background: #fff; border-radius: 8px; }
    .urlbox { font-size: 12px; color: var(--accent); word-break: break-all; }
    .hint { font-size: 12px; color: #6d7284; margin-top: 18px; line-height: 1.6; }
    @media (max-width: 860px) {
      .wrap { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      main.stage { min-height: 58vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">光</div>
        <div>
          <h1>光渡 AirLite</h1>
          <p>电脑发送端 · 无服务器 · 屏幕二维码视频流</p>
        </div>
      </div>
      <div class="hint" id="clockHint">空格暂停 · F 全屏 · Esc 停止</div>
    </header>
    <div class="wrap">
      <aside>
        <div class="banner" id="errBanner"></div>
        <div class="drop" id="drop">
          <strong>把文件拖到这个窗口任意位置</strong>
          <span class="sub">或直接用下面的系统选择框，点「打开」后应立刻出现文件名</span>
          <input id="file" type="file" multiple />
          <div class="picked" id="picked">还没有选中文件</div>
        </div>
        <div class="row">
          <label class="k">或粘贴文字</label>
          <textarea id="text" placeholder="把文字贴在这里，点「发送文字」"></textarea>
        </div>
        <div class="row">
          <label class="k">速度预设（手机网页建议「高速」；激进/极限要贴得更近）</label>
          <div class="presets" id="presets"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="btnSend">开始发送</button>
          <button class="btn ghost" id="btnText">发送文字</button>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btnPause">暂停</button>
          <button class="btn ghost" id="btnStop">停止</button>
        </div>
        <div class="meta" id="meta">尚未选择文件。</div>
        <div class="live" id="live" hidden>
          <div id="hudName">—</div>
          <div class="bar"><i id="hudBar"></i></div>
          <div id="hudStat"></div>
        </div>
        <p class="hint">
          电脑可直接双击本文件发送。手机请用 Safari / Chrome 打开右侧二维码地址（GitHub 网页），再授权摄像头对准本屏。不要用微信内置浏览器。
        </p>
      </aside>
      <main class="stage">
        <canvas id="qrStage"></canvas>
        <div class="empty" id="empty">
          <div class="pair">
            <h2>第一步：手机扫这个码打开接收端</h2>
            <canvas id="pairQr" width="196" height="196"></canvas>
            <div class="urlbox" id="recvUrl"></div>
            <div>第二步：选文件点「开始发送」，把手机对准屏幕上的动态二维码。</div>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="vendor/qrcode-generator.min.js"></script>
  <script src="vendor/fflate.js"></script>
  <script src="protocol.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const fileInput = $("file");
      const drop = $("drop");
      const canvas = $("qrStage");
      const ctx = canvas.getContext("2d", { alpha: false });
      const P = typeof AirLite !== "undefined" ? AirLite : null;
      const RECEIVER_URL = (window.AIRLITE && AIRLITE.RECEIVER) || "https://shuipashui.github.io/airlite/receiver.html";

      let presetKey = "fast";
      let files = [];
      let playing = false;
      let paused = false;
      let raf = 0;
      let lastTs = 0;
      let session = {
        meta: null,
        chunks: null,
        desc: null,
        srcEsi: 0,
        repairSeed: 1,
        frames: 0,
        started: 0,
        tileSeq: 0
      };

      function showErr(msg) {
        const el = $("errBanner");
        el.textContent = msg;
        el.classList.add("show");
      }

      window.addEventListener("error", (e) => {
        showErr("脚本错误：" + (e.message || e));
      });

      function fmtBytes(n) {
        if (n < 1024) return n + " B";
        if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
        return (n / 1048576).toFixed(2) + " MB";
      }

      function updateMeta() {
        const names = files.map((f) => f.name).join("、") || "未选文件";
        const size = files.reduce((s, f) => s + (f.size || 0), 0);
        $("picked").textContent = files.length
          ? ("已选 " + files.length + " 个：" + names + "（" + fmtBytes(size) + "）")
          : "还没有选中文件";
        if (!P) {
          $("meta").textContent = "文件已选中，但发送库未加载。请用「打开发送端.bat」打开，或打开完整文件夹里的 sender.html。";
          return;
        }
        const p = P.PRESETS[presetKey];
        $("meta").innerHTML =
          "文件：<b>" + names + "</b><br>" +
          "大小：<b>" + fmtBytes(size) + "</b>" + (files.length > 1 ? "（将打包 zip）" : "") + "<br>" +
          "预设：<b>" + p.label + "</b> · 理论峰值 <b>" + fmtBytes(p.tiles * P.chunkSizeForVersion(p.version) * p.fps) + "/s</b><br>" +
          "喷泉码：源符号发完后持续发不重复修复符号";
      }

      function takeFiles(list) {
        const next = Array.from(list || []).filter((f) => f && f.name);
        if (!next.length) {
          $("picked").textContent = "没有拿到文件，请再选一次";
          return;
        }
        files = next;
        updateMeta();
      }

      function allowDrag(e) {
        e.preventDefault();
        e.dataTransfer && (e.dataTransfer.dropEffect = "copy");
        drop.classList.add("over");
      }

      document.addEventListener("dragenter", allowDrag);
      document.addEventListener("dragover", allowDrag);
      document.addEventListener("dragleave", (e) => {
        if (e.target === document || e.target === document.body) drop.classList.remove("over");
      });
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        const list = e.dataTransfer && e.dataTransfer.files;
        if (list && list.length) takeFiles(list);
      });

      fileInput.addEventListener("change", () => takeFiles(fileInput.files));
      fileInput.addEventListener("input", () => takeFiles(fileInput.files));

      function renderPresets() {
        const box = $("presets");
        box.innerHTML = "";
        if (!P) {
          box.textContent = "发送库未加载";
          return;
        }
        Object.keys(P.PRESETS).forEach((key) => {
          const p = P.PRESETS[key];
          const b = document.createElement("button");
          b.type = "button";
          b.className = "preset" + (key === presetKey ? " on" : "");
          b.innerHTML = "<b>" + p.label + "</b><small>" + p.tiles + "码 · V" + p.version + " · " + p.fps + "fps<br>" + p.hint + "</small>";
          b.onclick = () => { presetKey = key; renderPresets(); updateMeta(); };
          box.appendChild(b);
        });
      }

      async function packPayload(kind) {
        if (kind === "text") {
          const text = $("text").value;
          if (!text.trim()) throw new Error("请先输入文字");
          const raw = P.utf8Encode(text);
          if (typeof fflate !== "undefined") {
            const gz = fflate.gzipSync(raw, { level: 6 });
            const useGz = gz.length < raw.length;
            return { name: "note.txt", data: useGz ? gz : raw, flags: useGz ? 1 : 0, rawSize: raw.length };
          }
          return { name: "note.txt", data: raw, flags: 0, rawSize: raw.length };
        }
        if (!files.length) throw new Error("请先选择文件");
        let name, raw;
        if (files.length === 1) {
          name = files[0].name;
          raw = new Uint8Array(await files[0].arrayBuffer());
        } else if (typeof fflate !== "undefined") {
          const bag = {};
          for (const f of files) bag[f.name] = new Uint8Array(await f.arrayBuffer());
          raw = fflate.zipSync(bag, { level: 6 });
          name = "bundle.zip";
        } else {
          throw new Error("多文件需要压缩库。请用「打开发送端.bat」打开完整目录。");
        }
        let data = raw;
        let flags = 0;
        if (files.length === 1 && typeof fflate !== "undefined") {
          try {
            const gz = fflate.gzipSync(raw, { level: 6 });
            if (gz.length < raw.length * 0.97) { data = gz; flags = 1; }
          } catch (_) {}
        }
        return { name, data, flags, rawSize: raw.length };
      }

      const qrScratch = document.createElement("canvas");

      function rasterQR(payload, version) {
        const qr = qrcode(version, "L");
        qr.addData(P.bytesToBinStr(payload), "Byte");
        qr.make();
        const n = qr.getModuleCount();
        if (qrScratch.width !== n || qrScratch.height !== n) {
          qrScratch.width = n;
          qrScratch.height = n;
        }
        const g = qrScratch.getContext("2d", { alpha: false });
        const img = g.createImageData(n, n);
        const px = img.data;
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            const on = qr.isDark(y, x);
            const i = (y * n + x) * 4;
            const v = on ? 0 : 255;
            px[i] = px[i + 1] = px[i + 2] = v;
            px[i + 3] = 255;
          }
        }
        g.putImageData(img, 0, 0);
        return { canvas: qrScratch, n: n };
      }

      function drawFrame(payloads, version) {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth || canvas.parentElement.clientWidth;
        const h = canvas.clientHeight || canvas.parentElement.clientHeight;
        if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);

        const n = payloads.length;
        const cols = n === 1 ? 1 : 2;
        const rows = Math.ceil(n / cols);
        const padX = 36;
        const padY = 36;
        const gap = n === 1 ? 0 : 22;
        const cellW = (w - padX * 2 - gap * (cols - 1)) / cols;
        const cellH = (h - padY * 2 - gap * (rows - 1)) / rows;
        const fit = Math.min(cellW, cellH) * (n === 1 ? 0.88 : 0.96);
        const cell = Math.floor(fit);

        for (let i = 0; i < n; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const ras = rasterQR(payloads[i], version);
          const quiet = n === 1 ? 8 : 6;
          const total = ras.n + quiet * 2;
          const mod = Math.max(2, Math.floor(cell / total));
          const size = total * mod;
          const ox = padX + col * (cellW + gap) + Math.floor((cellW - size) / 2);
          const oy = padY + row * (cellH + gap) + Math.floor((cellH - size) / 2);
          ctx.fillStyle = "#fff";
          ctx.fillRect(ox, oy, size, size);
          ctx.drawImage(
            ras.canvas, 0, 0, ras.n, ras.n,
            ox + quiet * mod, oy + quiet * mod, ras.n * mod, ras.n * mod
          );
        }
      }

      function nextPayloads() {
        const p = P.PRESETS[presetKey];
        const every = P.DESC_EVERY || 8;
        const k = session.chunks.length;
        const out = [];
        for (let t = 0; t < p.tiles; t++) {
          const seq = session.tileSeq++;
          if (seq % every === 0) {
            out.push(session.desc);
            continue;
          }
          if (session.srcEsi < k) {
            const esi = session.srcEsi++;
            out.push(P.buildSource(session.meta.session, esi, session.chunks[esi]));
            continue;
          }
          const seed = session.repairSeed++;
          if (seed === 0) session.repairSeed = 1;
          if (seed % 4 === 0) {
            const esi = ((seed / 4) | 0) % k;
            out.push(P.buildSource(session.meta.session, esi, session.chunks[esi]));
          } else {
            out.push(P.buildRepair(session.meta.session, seed, P.makeRepairPayload(session.chunks, seed)));
          }
        }
        return out;
      }

      function tick(ts) {
        if (!playing) return;
        const p = P.PRESETS[presetKey];
        const interval = 1000 / p.fps;
        if (!paused && (!lastTs || ts - lastTs >= interval - 1)) {
          lastTs = ts;
          try {
            const payloads = nextPayloads();
            drawFrame(payloads, p.version);
            session.frames++;
            const srcTotal = session.chunks.length;
            const srcSent = Math.min(session.srcEsi, srcTotal);
            const ratio = srcTotal ? srcSent / srcTotal : 0;
            $("hudBar").style.width = Math.min(100, ratio * 100) + "%";
            const elapsed = (performance.now() - session.started) / 1000;
            const emitted = session.tileSeq * P.chunkSizeForVersion(p.version);
            $("hudStat").innerHTML =
              (paused ? "已暂停<br>" : "") +
              srcSent + " / " + srcTotal + " 源符号" +
              (session.srcEsi >= srcTotal ? "<br>修复 +" + (session.repairSeed - 1) : "") +
              "<br>" + (elapsed ? fmtBytes(emitted / elapsed) + "/s" : "");
          } catch (err) {
            console.error(err);
            stopPlay();
            alert("生成二维码失败：" + err.message);
            return;
          }
        }
        raf = requestAnimationFrame(tick);
      }

      async function startPlay(kind) {
        if (!P || typeof qrcode === "undefined") {
          throw new Error("发送库没加载。请双击「打开发送端.bat」，不要只打开单独一个 HTML。");
        }
        stopPlay();
        $("btnSend").disabled = true;
        $("btnText").disabled = true;
        let packed;
        try {
          packed = await packPayload(kind);
        } finally {
          $("btnSend").disabled = false;
          $("btnText").disabled = false;
        }
        const limit = P.MAX_FILE || 12 * 1024 * 1024;
        if (packed.data.length > limit) {
          throw new Error("压缩后仍超过 " + fmtBytes(limit) + "，手机网页接收会很慢且容易中断。请改小文件或拆开再发。");
        }
        if (packed.data.length > 2 * 1024 * 1024) {
          const ok = confirm("压缩后约 " + fmtBytes(packed.data.length) + "，手机网页接收可能要几分钟。仍要发送吗？");
          if (!ok) return;
        }
        const p = P.PRESETS[presetKey];
        const chunkSize = P.chunkSizeForVersion(p.version);
        if (chunkSize < 32) throw new Error("块太小");
        const chunks = P.splitChunks(packed.data, chunkSize);
        const sid = P.newSessionId();
        const meta = {
          session: sid,
          name: packed.name,
          fileSize: packed.data.length,
          fileCrc: P.crc32(packed.data),
          chunkSize: chunkSize,
          numChunks: chunks.length,
          flags: packed.flags,
          tiles: p.tiles
        };
        session = {
          meta: meta,
          chunks: chunks,
          desc: P.buildDescriptor(meta),
          srcEsi: 0,
          repairSeed: 1,
          frames: 0,
          started: performance.now(),
          tileSeq: 0
        };
        $("empty").hidden = true;
        $("live").hidden = false;
        $("hudName").textContent = packed.name + "  ·  " + fmtBytes(packed.data.length) +
          (packed.flags & 1 ? " gzip" : "") + "  ·  原始 " + fmtBytes(packed.rawSize);
        playing = true;
        paused = false;
        lastTs = 0;
        $("btnPause").textContent = "暂停";
        raf = requestAnimationFrame(tick);
      }

      function stopPlay() {
        playing = false;
        paused = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        $("empty").hidden = false;
        $("live").hidden = true;
      }

      $("btnSend").onclick = () => startPlay("file").catch((e) => alert(e.message));
      $("btnText").onclick = () => startPlay("text").catch((e) => alert(e.message));
      $("btnStop").onclick = stopPlay;
      $("btnPause").onclick = () => {
        if (!playing) return;
        paused = !paused;
        $("btnPause").textContent = paused ? "继续" : "暂停";
      };

      function drawPairingQR() {
        $("recvUrl").textContent = RECEIVER_URL;
        const c = $("pairQr");
        if (!c || typeof qrcode === "undefined") return;
        const ctx2 = c.getContext("2d");
        const qr = qrcode(0, "M");
        qr.addData(RECEIVER_URL, "Byte");
        qr.make();
        const n = qr.getModuleCount();
        const quiet = 3;
        const total = n + quiet * 2;
        const size = c.width;
        const mod = size / total;
        ctx2.fillStyle = "#fff";
        ctx2.fillRect(0, 0, size, size);
        ctx2.fillStyle = "#000";
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            if (qr.isDark(y, x)) ctx2.fillRect((x + quiet) * mod, (y + quiet) * mod, mod, mod);
          }
        }
      }

      window.addEventListener("keydown", (e) => {
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "TEXTAREA" || tag === "INPUT") return;
        if (e.code === "Space") {
          e.preventDefault();
          $("btnPause").click();
        } else if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
          else document.exitFullscreen().catch(() => {});
        } else if (e.key === "Escape") {
          stopPlay();
        }
      });

      function fit() {
        const stage = canvas.parentElement;
        canvas.style.width = stage.clientWidth + "px";
        canvas.style.height = stage.clientHeight + "px";
      }
      window.addEventListener("resize", fit);
      fit();
      renderPresets();
      updateMeta();
      drawPairingQR();
      if (!P || typeof qrcode === "undefined") {
        showErr("发送库没有加载。请打开完整文件夹里的 sender.html（旁边要有 vendor 和 protocol.js）。");
      }
    })();
  </script>
</body>
